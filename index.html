<!DOCTYPE html>
<html lang="ro">
<head>
<script>document.documentElement.classList.add("js")</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La mulți ani, Nicoleta! 18 ani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7ECEE;--paper:#FFF8F7;--ink:#3A0D19;--muted:#6B3A47;--line:#D9B9C0;--burg:#6D1A2E;--deep:#3F0E1A;--gold:#C8A27A;--blush:#F5E4E7;
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22070E;--paper:#2E0D17;--ink:#F5E4E7;--muted:#D2AEB6;--line:#5A2433;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#22070E;--paper:#2E0D17;--ink:#F5E4E7;--muted:#D2AEB6;--line:#5A2433;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.05;letter-spacing:-.01em}
p{margin:0}

/* Textură fină de fundal */
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.08;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.14'/%3E%3C/svg%3E")}

/* Navigație luxoasă */
.lux-nav{position:fixed;top:0;left:0;right:0;z-index:55;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:12px clamp(1rem,4vw,3.5rem);background:rgba(48,8,20,.85);border-bottom:1px solid rgba(200,162,122,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#F5E4E7;transform:translateY(-110%);transition:transform .45s ease,background .3s}
.lux-nav.show{transform:translateY(0)}
.lux-brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:#F5E4E7;font-size:.7rem;letter-spacing:.18em;font-weight:700;white-space:nowrap}
.lux-brand small{display:block;color:#C8A27A;font-size:.52rem;letter-spacing:.2em;margin-top:2px}
.brand-seal{display:grid;place-items:center;width:34px;height:34px;border:1px solid #C8A27A;border-radius:50%;font:italic 1.35rem var(--serif);color:#E8CDA6}
.lux-links{display:flex;align-items:center;gap:clamp(.7rem,2vw,1.8rem)}
.lux-links a{color:#F5E4E7;text-decoration:none;font-size:.65rem;letter-spacing:.13em;text-transform:uppercase;opacity:.86;transition:color .2s}
.lux-links a:hover{color:#E8CDA6}
.theme-toggle{width:35px;height:35px;flex:0 0 35px;border-radius:50%;border:1px solid #C8A27A;background:transparent;color:#E8CDA6;cursor:pointer;font-size:1.1rem;transition:transform .25s,background .25s}
.theme-toggle:hover{transform:rotate(25deg);background:rgba(200,162,122,.15)}

/* Hero */
.hero{position:relative;isolation:isolate;background:radial-gradient(120% 90% at 85% 10%,#8A2540 0%,var(--burg) 38%,var(--deep) 100%);color:var(--blush);padding:clamp(5rem,10vw,8rem) clamp(1.25rem,6vw,5rem);min-height:100vh;min-height:100svh;display:grid;align-items:center}
.hero:before{content:"";position:absolute;inset:20px;border:1px solid rgba(200,162,122,.25);pointer-events:none;z-index:-1}
.hero:after{content:"✦";position:absolute;right:7%;top:12%;font-size:clamp(2rem,5vw,4rem);color:rgba(200,162,122,.5);animation:luxTwinkle 4s ease-in-out infinite}
@keyframes luxTwinkle{0%,100%{opacity:.35;transform:rotate(0) scale(.9)}50%{opacity:1;transform:rotate(35deg) scale(1.08)}}

.hero-in{max-width:1180px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(2rem,5vw,5rem);align-items:center}
.hero .greet{font-family:var(--serif);font-style:italic;font-size:clamp(1.5rem,3vw,2.2rem);color:var(--gold);font-weight:500}
.hero h1{font-size:clamp(3.2rem,9vw,7.5rem);margin:.4rem 0 1.2rem}
.hero .age{display:flex;align-items:baseline;gap:1rem;margin-bottom:1.5rem}
.hero .age b{font-family:var(--serif);font-weight:600;font-size:clamp(7rem,22vw,17rem);line-height:.8;color:var(--gold)}
.hero .age span{font-family:var(--serif);font-size:clamp(1.6rem,3.5vw,2.6rem);line-height:1.1}
.hero p.lead{max-width:34ch;color:#E8CBD1}
.portrait{justify-self:center;width:min(100%,420px);aspect-ratio:3/4;border-radius:999px 999px 14px 14px;overflow:hidden;border:2px solid var(--gold);padding:10px;background:rgba(0,0,0,.18);box-shadow:0 25px 90px rgba(12,0,5,.3);transition:transform .5s ease,box-shadow .5s ease}
.portrait:hover{transform:translateY(-5px);box-shadow:0 35px 100px rgba(12,0,5,.45)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;border-radius:999px 999px 6px 6px}

/* Animații intro */
.hero .age,.hero h1,.hero .greet,.hero .lead,.portrait{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero .greet{animation-delay:.05s}.hero h1{animation-delay:.2s}.hero .age{animation-delay:.4s}.hero .lead{animation-delay:.6s}.portrait{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* Intro */
.intro{padding:clamp(3.5rem,8vw,7rem) 1.5rem;text-align:center;position:relative;overflow:hidden}
.intro:before,.intro:after{content:"❧";position:absolute;color:var(--gold);opacity:.25;font:clamp(3rem,10vw,8rem) var(--serif);pointer-events:none}
.intro:before{left:2%;top:10%;transform:rotate(-25deg)}.intro:after{right:2%;bottom:4%;transform:rotate(155deg)}
.intro h2{font-size:clamp(2rem,5vw,3.6rem);max-width:20ch;margin:0 auto 1rem;color:var(--burg)}
.intro p{max-width:52ch;margin:0 auto;color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .intro h2{color:#E7A7B6}}
:root[data-theme="dark"] .intro h2{color:#E7A7B6}

/* Capitole */
.chap{padding:clamp(2.5rem,6vw,5.5rem) clamp(1.25rem,6vw,5rem);position:relative;overflow:hidden}
.chap:nth-of-type(even){background:var(--paper);background-image:linear-gradient(135deg,rgba(200,162,122,.06),transparent 55%)}
.chap-in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.75rem,5vw,5rem);align-items:center}
.chap.flip .chap-in>figure{order:2}
figure{margin:0;position:relative;isolation:isolate}
figure img{width:100%;height:auto;border-radius:6px;box-shadow:0 24px 50px -28px rgba(63,14,26,.7);transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .8s}
figure:hover img{transform:scale(1.025);filter:saturate(1.08)}
figure::after{content:"";position:absolute;inset:14px -14px -14px 14px;border:1.5px solid var(--burg);border-radius:6px;z-index:-1;opacity:.55;transition:transform .45s,opacity .45s}
.chap.flip figure::after{inset:14px 14px -14px -14px}
figure:hover:after{transform:translate(4px,4px);opacity:.9}
.chap h2{font-size:clamp(2.1rem,4.2vw,3.2rem);color:var(--burg);margin-bottom:1rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chap h2{color:#E7A7B6}:root:not([data-theme="light"]) figure::after{border-color:#E7A7B6}}
:root[data-theme="dark"] .chap h2{color:#E7A7B6}:root[data-theme="dark"] figure::after{border-color:#E7A7B6}
.chap p{color:var(--muted);max-width:42ch}
.chap .tall img{aspect-ratio:4/5;object-fit:cover;object-position:50% 25%}

/* Secțiune wide / bandă */
.band{position:relative;background:#000;overflow:hidden}
.band img{width:100%;height:clamp(340px,62vw,720px);object-fit:cover;object-position:50% 45%;opacity:.92;transition:transform 1.2s ease}
.band:hover img{transform:scale(1.025)}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(63,14,26,.95) 0%,rgba(63,14,26,.35) 45%,rgba(63,14,26,0) 70%)}
.band div{position:absolute;z-index:1;left:clamp(1.25rem,6vw,5rem);right:1.25rem;bottom:clamp(1.5rem,5vw,4rem);color:var(--blush);max-width:560px}
.band h2{font-size:clamp(2.1rem,5vw,3.8rem);color:#fff;margin-bottom:.6rem}
.band p{color:#EBD0D6}

/* Final / Tort / Scrisoare */
.end{background:linear-gradient(180deg,var(--burg),var(--deep));color:var(--blush);text-align:center;padding:clamp(4rem,9vw,8rem) 1.5rem calc(clamp(4rem,9vw,8rem) + 8px);position:relative;overflow:hidden}
.end:before,.end:after{content:"✧";position:absolute;color:rgba(200,162,122,.45);font-size:4rem;animation:luxTwinkle 5s ease-in-out infinite}
.end:before{left:8%;top:12%}.end:after{right:8%;bottom:10%;animation-delay:1.2s}
.end h2{font-size:clamp(2.6rem,7vw,5.5rem);margin-bottom:1.5rem}
.end p{max-width:50ch;margin:0 auto 1rem;color:#EBD0D6}
.end .sig{font-family:var(--serif);font-style:italic;font-size:1.8rem;color:var(--gold);margin-top:2rem}
.end hr{width:64px;border:0;border-top:1.5px solid var(--gold);margin:2rem auto}

.cake{width:min(86%,340px);display:block;margin:1rem auto .25rem}
.end #blow{margin-top:.15rem}
.end #letter .card{margin-top:1rem;box-shadow:0 20px 55px rgba(0,0,0,.15)}

/* Flăcări lumânări optimizate */
.cake .flame { fill: #ffb52e !important; opacity: 1 !important; transform-box: fill-box; transform-origin: 50% 100%; animation: candleBurn .32s ease-in-out infinite alternate !important; filter: drop-shadow(0 0 3px #ff9d24) drop-shadow(0 0 7px rgba(255,125,20,.85)); }
.cake .flame:nth-of-type(2n) { animation-duration: .24s !important; animation-delay: -.13s; fill: #ffd65a !important; }
.cake .flame.out { opacity: 0 !important; transform: translateY(5px) scale(.1) !important; animation: none !important; filter: none !important; }
@keyframes candleBurn { 0% { transform: scale(.92,1.04) rotate(-4deg); } 50% { transform: scale(1.04,.96) rotate(2deg); } 100% { transform: scale(.86,1.12) rotate(5deg); } }

#letter{display:grid;grid-template-rows:0fr;transition:grid-template-rows 1s ease}
#letter.show{grid-template-rows:1fr}
#letter>div{overflow:hidden;min-height:0}
#letter .card{max-width:56ch;margin:2.5rem auto 0;padding:2rem 1.5rem;border:1.5px solid var(--gold);border-radius:6px;background:rgba(0,0,0,.18);text-align:left}
#letter h3{font-size:2rem;color:var(--gold);margin-bottom:.8rem}
#letter p{margin:0 0 .9rem}

/* Butoane și elemente globale */
.btn{font:600 1rem var(--sans);color:#3F0E1A;background:var(--gold);border:0;border-radius:999px;padding:.9rem 2rem;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(0,0,0,.16)}
.btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}
.btn:disabled{opacity:.75;cursor:default}

#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;background:var(--gold);transform:scaleX(0);transform-origin:0 50%;z-index:50;box-shadow:0 0 10px rgba(200,162,122,.6)}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120}

#mus, #toTop{position:fixed;right:1rem;z-index:60;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--gold);background:rgba(63,14,26,.92);color:var(--gold);cursor:pointer;font-size:1.3rem;display:grid;place-items:center;box-shadow:0 8px 25px rgba(0,0,0,.18)}
#mus{bottom:calc(1rem + env(safe-area-inset-bottom,0px))}
#mus.off::after{content:"";position:absolute;width:28px;border-top:2px solid var(--gold);transform:rotate(-45deg)}

#toTop{bottom:calc(4.7rem + env(safe-area-inset-bottom,0px));font-size:1.1rem;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .25s,transform .25s}
#toTop.visible{opacity:1;pointer-events:auto;transform:none}

/* Gateway / Ecran de pornire */
#gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;text-align:center;padding:2rem;background:radial-gradient(100% 90% at 50% 12%,#9B3552,#6D1A2E 43%,#25060F);color:var(--blush);transition:transform 1s cubic-bezier(.7,0,.2,1)}
#gate.open{transform:translateY(-100%)}
#gate h2{font-size:clamp(2rem,6vw,3.6rem);max-width:16ch;font-weight:500;letter-spacing:-.02em}
#gate p{color:#E8CBD1;max-width:34ch}
#gate .row{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem}
#gate svg{width:104px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 12px 20px rgba(0,0,0,.2))}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}

/* Lightbox imagini */
#lb{position:fixed;inset:0;z-index:110;background:rgba(30,5,12,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:3.5rem 1rem 2rem}
#lb img{max-width:92vw;max-height:76vh;object-fit:contain;border-radius:6px}
#lb p{font-family:var(--serif);font-size:1.5rem;color:var(--blush)}
#lb button{position:absolute;background:none;border:0;color:var(--gold);font-size:2.6rem;line-height:1;cursor:pointer;padding:.5rem 1rem}
#lb .lb-x{top:calc(.5rem + env(safe-area-inset-top,0px));right:.5rem}#lb .lb-p{left:.25rem;top:50%}#lb .lb-n{right:.25rem;top:50%}

.chap figure img,.band img,.portrait img{cursor:zoom-in}
.js .chap figure img{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.2,.7,.2,1)}
.js .chap.in figure img{clip-path:inset(0)}
.js .chap .txt{opacity:0;transform:translateY(16px);transition:opacity .9s .3s,transform .9s .3s}
.js .chap.in .txt{opacity:1;transform:none}

@media (max-width:760px){
.lux-nav{padding:9px 12px}.lux-brand{font-size:.58rem;letter-spacing:.12em}.brand-seal{width:30px;height:30px}.lux-links{gap:.65rem}.lux-links a{font-size:.54rem;letter-spacing:.06em}.theme-toggle{width:31px;height:31px;flex-basis:31px}
.hero-in,.chap-in{grid-template-columns:1fr}
.hero{min-height:auto}
.portrait{width:min(78%,340px);order:-1}
.chap.flip .chap-in>figure{order:0}
figure::after{inset:10px -8px -10px 8px!important}
.chap p{max-width:none}
}
@media (max-width:390px){.lux-links a:nth-child(2){display:none}.lux-brand small{font-size:.45rem}}
@media (prefers-reduced-motion:reduce){
.hero *,.chap figure img,.chap .txt{animation:none!important;clip-path:none!important;opacity:1!important;transform:none!important}
.lux-nav,.hero .portrait{transition:none!important}
}
</style>
</head>
<body>
<!-- Pagina este pregătită și optimizată pentru Nicoleta -->
</body>
</html>
